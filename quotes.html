<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saved Quotes | RSAinn</title>

  <style>
    :root {
      --green: #004d3b;
      --green-light: #0a6852;
      --background: #f5f6f4;
      --white: #ffffff;
      --text: #17201d;
      --muted: #6b746f;
      --border: #e2e6e3;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      background: var(--green);
      color: white;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .brand p {
      margin: 6px 0 0;
      opacity: 0.8;
    }

    .back-btn {
      display: inline-block;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: bold;
    }

    main {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h2 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .page-title p {
      margin-top: 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 15px;
    }

    .new-quote-btn {
      background: var(--green);
      color: white;
      border: none;
      text-decoration: none;
      padding: 13px 18px;
      border-radius: 9px;
      font-weight: bold;
    }

    .quotes-card {
      background: var(--white);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: #f8faf8;
      text-align: left;
      padding: 15px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
    }

    td {
      padding: 16px 15px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafcfb;
    }

    .quote-number {
      font-weight: bold;
      color: var(--green);
    }

    .amount {
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
      background: #e8f3ef;
      color: var(--green);
    }

    .action-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--green);
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .action-btn:hover {
      background: #f1f7f5;
    }

    .message {
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: #a52828;
    }

    @media (max-width: 650px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .brand h1 {
        font-size: 23px;
      }

      main {
        margin-top: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <h1>RSAinn Holiday Getaways</h1>
      <p>Quotation & Booking Portal</p>
    </div>

    <a class="back-btn" href="index.html">
      ← Back to Dashboard
    </a>

  </div>
</header>

<main>

  <div class="page-title">
    <h2>Saved Quotes</h2>
    <p>View and manage accommodation quotations.</p>
  </div>

  <div class="toolbar">

    <input
      type="text"
      id="searchQuotes"
      class="search-box"
      placeholder="Search by quote number or guest name..."
    >

    <a href="quote.html" class="new-quote-btn">
      + Create New Quote
    </a>

  </div>

  <div class="quotes-card">

    <div id="loadingMessage" class="message">
      Loading quotations...
    </div>

    <div class="table-wrapper" id="quotesTableWrapper" style="display:none;">

      <table>

        <thead>
          <tr>
            <th>Quote</th>
            <th>Guest</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Nights</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="quotesBody"></tbody>

      </table>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://xhxwjaobubxbretiqwsr.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_dN3KP37RRjRY-_0SFCYPkA_lsszaNoH";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let allQuotes = [];

  function money(value) {

    return "R" + Number(value || 0).toLocaleString("en-ZA", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  }

  function formatDate(value) {

    if (!value) return "-";

    const date = new Date(value + "T00:00:00");

    return date.toLocaleDateString("en-ZA", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

  }

  function displayQuotes(quotes) {

    const body = document.getElementById("quotesBody");
    const wrapper = document.getElementById("quotesTableWrapper");
    const message = document.getElementById("loadingMessage");

    body.innerHTML = "";

    if (!quotes.length) {

      wrapper.style.display = "none";
      message.style.display = "block";
      message.className = "message";
      message.textContent = "No quotations found.";

      return;
    }

    message.style.display = "none";
    wrapper.style.display = "block";

    quotes.forEach(function (quote) {

      const row = document.createElement("tr");

      row.innerHTML = `
        <td class="quote-number">
          ${quote.quote_number || "-"}
        </td>

        <td>
          ${quote.guest_name || "-"}
        </td>

        <td>
          ${formatDate(quote.check_in)}
        </td>

        <td>
          ${formatDate(quote.check_out)}
        </td>

        <td>
          ${quote.number_of_nights || 0}
        </td>

        <td class="amount">
          ${money(quote.total_due)}
        </td>

        <td>
          <span class="status">
            ${quote.status || "draft"}
          </span>
        </td>

       <td>
    <button
        class="action-btn"
        onclick="openQuote(${quote.id})"
    >
        View
    </button>

    <button
        class="action-btn delete-btn"
        onclick="deleteQuote(${quote.id}, '${quote.quote_number || ""}')"
    >
        Delete
    </button>
</td>
      `;

      body.appendChild(row);

    });

  }

  async function loadQuotes() {

    const message = document.getElementById("loadingMessage");

    message.style.display = "block";
    message.className = "message";
    message.textContent = "Loading quotations...";

    const { data, error } = await supabaseClient
      .from("quotes")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {

      console.error("Quote loading error:", error);

      message.className = "message error";
      message.textContent =
        "Unable to load quotations: " + error.message;

      return;
    }

    allQuotes = data || [];

    displayQuotes(allQuotes);

  }
async function deleteQuote(quoteId, quoteNumber) {

    const confirmed = confirm(
        "Are you sure you want to delete quotation " +
        (quoteNumber || quoteId) +
        "?\n\nThis action cannot be undone."
    );

    if (!confirmed) {
        return;
    }

    try {

        const { error } = await supabaseClient
            .from("quotes")
            .delete()
            .eq("id", quoteId);

        if (error) {
            throw error;
        }

        alert(
            "Quotation " +
            (quoteNumber || quoteId) +
            " has been deleted successfully."
        );

        await loadQuotes();

    } catch (error) {

        console.error("Quote deletion error:", error);

        alert(
            "The quotation could not be deleted.\n\n" +
            error.message
        );
    }
}
  function openQuote(id) {
    window.location.href = "quote-preview.html?id=" + encodeURIComponent(id);
}

  document
    .getElementById("searchQuotes")
    .addEventListener("input", function () {

      const search = this.value.toLowerCase().trim();

      const filtered = allQuotes.filter(function (quote) {

        return (
          String(quote.quote_number || "")
            .toLowerCase()
            .includes(search) ||

          String(quote.guest_name || "")
            .toLowerCase()
            .includes(search)
        );

      });

      displayQuotes(filtered);

    });

  loadQuotes();

</script>

</body>
</html>
