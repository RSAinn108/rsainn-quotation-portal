<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Quotes | RSAinn</title>
<style>
:root{--green:#004d3b;--muted:#6b746f;--border:#e2e6e3}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f4;color:#17201d}header{background:var(--green);color:white;padding:22px 20px}.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0;font-size:28px}.brand p{margin:6px 0 0;opacity:.8}.back-btn{color:white;text-decoration:none;border:1px solid #ffffff55;padding:12px 18px;border-radius:9px;font-weight:bold}main{max-width:1200px;margin:35px auto;padding:0 20px}.page-title h2{font-size:28px;margin-bottom:5px}.page-title p{margin-top:0;color:var(--muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}.search-box,.filter{padding:12px;border:1px solid var(--border);border-radius:9px;font-size:15px;background:white}.search-box{flex:1;min-width:200px}.new-quote-btn{background:var(--green);color:white;text-decoration:none;padding:13px 18px;border-radius:9px;font-weight:bold}.quotes-card{background:white;border-radius:14px;box-shadow:0 10px 30px #0001;overflow:hidden}.table-wrapper{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th{background:#f8faf8;text-align:left;padding:15px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);text-transform:uppercase}td{padding:14px;border-bottom:1px solid var(--border)}tbody tr:hover{background:#fafcfb}.quote-number,.amount{font-weight:bold;color:var(--green)}.status{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold;text-transform:capitalize}.active{background:#e7f7ed;color:#067647}.expired{background:#fff0ed;color:#b42318}.converted{background:#e8f1ff;color:#175cd3}.cancelled{background:#eee;color:#555}.action-btn{display:inline-block;border:1px solid var(--border);background:white;color:var(--green);padding:8px 12px;border-radius:7px;cursor:pointer;font-weight:bold;text-decoration:none;margin:2px}.action-btn:hover{background:#f1f7f5}.delete-btn{color:#a52828}.message{padding:35px;text-align:center;color:var(--muted)}.error{color:#a52828}@media(max-width:650px){.header-inner{align-items:flex-start;flex-direction:column}.brand h1{font-size:23px}main{margin-top:25px}}
</style></head><body><header><div class="header-inner"><div class="brand"><h1>RSAinn Holiday Getaways</h1><p>Quotation & Booking Portal</p></div><a class="back-btn" href="index.html">← Back to Dashboard</a></div></header>
<main><div class="page-title"><h2>Saved Quotes</h2><p>View and manage accommodation quotations.</p></div><div class="toolbar"><input id="searchQuotes" class="search-box" placeholder="Search by quote number or guest name..."><select id="statusFilter" class="filter" aria-label="Filter quotation status"><option value="all">All quotations</option><option value="active">Active quotes</option><option value="expired">Expired quotes</option><option value="converted">Converted quotes</option><option value="cancelled">Cancelled quotes</option></select><a href="quote.html" class="new-quote-btn">+ Create New Quote</a></div><div class="quotes-card"><div id="loadingMessage" class="message">Loading quotations...</div><div class="table-wrapper" id="quotesTableWrapper" style="display:none"><table><thead><tr><th>Quote</th><th>Guest</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Total</th><th>Status</th><th>Valid until</th><th>Action</th></tr></thead><tbody id="quotesBody"></tbody></table></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabaseClient=supabase.createClient('https://xhxwjaobubxbretiqwsr.supabase.co','sb_publishable_dN3KP37RRjRY-_0SFCYPkA_lsszaNoH');let allQuotes=[];
const money=v=>'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(v){if(!v)return '—';const d=new Date(String(v).slice(0,10)+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'})}
function quoteState(q){const s=String(q.status||'').toLowerCase();if(['accepted','converted','confirmed','booked'].includes(s))return 'converted';if(['cancelled','canceled','deleted'].includes(s))return 'cancelled';const until=String(q.valid_until||'').slice(0,10);return until&&until<localToday()?'expired':'active'}
function displayQuotes(){const body=document.getElementById('quotesBody'),wrapper=document.getElementById('quotesTableWrapper'),msg=document.getElementById('loadingMessage');const search=document.getElementById('searchQuotes').value.toLowerCase().trim(),filter=document.getElementById('statusFilter').value;const rows=allQuotes.filter(q=>(filter==='all'||quoteState(q)===filter)&&[q.quote_number,q.guest_name].some(v=>String(v||'').toLowerCase().includes(search)));if(!rows.length){wrapper.style.display='none';msg.style.display='block';msg.className='message';msg.textContent='No quotations match this filter.';return}msg.style.display='none';wrapper.style.display='block';body.innerHTML=rows.map(q=>{const state=quoteState(q);return `<tr><td class="quote-number">${escapeHTML(q.quote_number||'—')}</td><td>${escapeHTML(q.guest_name||'—')}</td><td>${formatDate(q.check_in)}</td><td>${formatDate(q.check_out)}</td><td>${escapeHTML(q.number_of_nights??'—')}</td><td class="amount">${money(q.total_due)}</td><td><span class="status ${state}">${state}</span></td><td>${formatDate(q.valid_until)}</td><td><a class="action-btn" href="quote-preview.html?id=${encodeURIComponent(q.id)}">View</a><button class="action-btn delete-btn" data-id="${escapeHTML(q.id)}">Delete</button></td></tr>`}).join('');body.querySelectorAll('.delete-btn').forEach(btn=>btn.addEventListener('click',()=>{const q=allQuotes.find(x=>String(x.id)===btn.dataset.id);if(q)deleteQuote(q)}))}
async function loadQuotes(){const msg=document.getElementById('loadingMessage');msg.style.display='block';msg.textContent='Loading quotations...';const {data,error}=await supabaseClient.from('quotes').select('*').order('created_at',{ascending:false});if(error){msg.className='message error';msg.textContent='Unable to load quotations: '+error.message;return}allQuotes=data||[];displayQuotes()}
async function deleteQuote(q){if(!confirm(`Are you sure you want to delete quotation ${q.quote_number||q.id}?\n\nThis cannot be undone.`))return;const {error}=await supabaseClient.from('quotes').delete().eq('id',q.id);if(error){alert('The quotation could not be deleted: '+error.message);return}alert('Quotation deleted successfully.');await loadQuotes()}
document.getElementById('searchQuotes').addEventListener('input',displayQuotes);document.getElementById('statusFilter').addEventListener('change',displayQuotes);const initialFilter=new URLSearchParams(location.search).get('filter');if(['active','expired','converted','cancelled'].includes(initialFilter))document.getElementById('statusFilter').value=initialFilter;loadQuotes();
</script></body></html>
